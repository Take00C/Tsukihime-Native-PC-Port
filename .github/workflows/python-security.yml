name: Python security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '24 8 * * 1'

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: tools
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Create an isolated environment
        run: python -m venv .venv
      - name: Select the environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install reviewed wheels
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Check the environment
        run: python tools/setup/check_python.py --security-only
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check published security advisories
        run: python -m pip_audit --strict --disable-pip --no-deps -r requirements-dev.txt
      - name: Test with native decoders
        run: python -m pytest tools/tests -q
      - name: Test without native decoders
        env:
          TSUKI_NO_NUMBA: '1'
        run: python -m pytest tools/tests/test_audio.py tools/tests/test_containers.py -q
